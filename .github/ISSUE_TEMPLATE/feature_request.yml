name: Idea or feature request
description: A stat, a look or an option you'd like to see.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
      description: The situation behind the idea helps decide how it should work.
